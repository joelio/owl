<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="Parliament of Owls — query multiple LLMs in parallel">
  <!--
    Parliament of Owls — banner
    Self-backgrounded indigo card so it renders identically on light and dark
    GitHub themes. Left: the seal mark. Right: the council — three owls of
    different colours (different models) sharing one perch; one is asleep.
    Text uses a generic system stack only; nothing breaks without webfonts.
    Palette: ink #263250 / card #1B2236 / amber #E9A83E / cream #F5EBD8 / slate #6B7A9E
  -->
  <defs>
    <!-- Shared owl bust silhouette (same geometry as owl-logo.svg) -->
    <path id="owl-bust" d="M 100 66
      Q 77 64 50 30
      Q 34 58 38 92
      C 39 132 60 168 100 170
      C 140 168 161 132 162 92
      Q 166 58 150 30
      Q 123 64 100 66 Z"/>
    <clipPath id="card-clip">
      <rect x="2" y="2" width="796" height="196" rx="18"/>
    </clipPath>
  </defs>

  <!-- Card -->
  <rect x="2" y="2" width="796" height="196" rx="18" fill="#1B2236" stroke="#39466B" stroke-width="2.5"/>

  <g clip-path="url(#card-clip)">
    <!-- Faint echo of the seal ring, top right -->
    <circle cx="700" cy="10" r="112" fill="none" stroke="#E9A83E" stroke-width="3"
            stroke-linecap="round" stroke-dasharray="0.1 12" opacity="0.18"/>

    <!-- The seal mark -->
    <g transform="translate(28,28) scale(0.72)">
      <circle cx="100" cy="100" r="94" fill="#E9A83E"/>
      <circle cx="100" cy="100" r="84" fill="none" stroke="#B97A24" stroke-width="3.5"
              stroke-linecap="round" stroke-dasharray="0.1 12.05"/>
      <use href="#owl-bust" fill="#263250"/>
      <circle cx="68"  cy="88" r="26" fill="#F5EBD8"/>
      <circle cx="132" cy="88" r="26" fill="#F5EBD8"/>
      <circle cx="68"  cy="88" r="14" fill="#263250"/>
      <circle cx="132" cy="88" r="14" fill="#263250"/>
      <path fill="#E9A83E" d="M 100 110 L 108 118 L 100 132 L 92 118 Z"/>
      <path d="M 84 142 Q 100 150 116 142" stroke="#3A4869" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M 89 154 Q 100 160 111 154" stroke="#3A4869" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Wordmark -->
    <text x="200" y="84" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="42" font-weight="800" letter-spacing="-0.5"
          fill="#F5EBD8">Parliament of <tspan fill="#E9A83E">Owls</tspan></text>

    <!-- Tagline -->
    <text x="200" y="116" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="17" fill="#9BA8C6">Query multiple LLMs in parallel.</text>

    <!-- CLI chip -->
    <rect x="200" y="134" width="158" height="32" rx="8" fill="#12182A" stroke="#39466B" stroke-width="1.5"/>
    <text x="214" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="14" fill="#E9A83E">$ owl ask "&#8230;"</text>

    <!-- The council: three models, one perch -->
    <line x1="588" y1="150" x2="778" y2="150" stroke="#4A5B85" stroke-width="4" stroke-linecap="round"/>

    <!-- amber member -->
    <g transform="translate(598,95.6) scale(0.32)">
      <use href="#owl-bust" fill="#E9A83E"/>
      <circle cx="72"  cy="90" r="11" fill="#1B2236"/>
      <circle cx="128" cy="90" r="11" fill="#1B2236"/>
      <path fill="#1B2236" d="M 100 104 L 108 112 L 100 126 L 92 112 Z"/>
    </g>
    <!-- cream member (asleep) -->
    <g transform="translate(643,82) scale(0.40)">
      <use href="#owl-bust" fill="#F5EBD8"/>
      <path d="M 60 88 Q 72 98 84 88"   stroke="#1B2236" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M 116 88 Q 128 98 140 88" stroke="#1B2236" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path fill="#1B2236" d="M 100 104 L 108 112 L 100 126 L 92 112 Z"/>
    </g>
    <!-- slate member (leaning) -->
    <g transform="translate(707,104.1) scale(0.27) rotate(-8 100 170)">
      <use href="#owl-bust" fill="#6B7A9E"/>
      <circle cx="72"  cy="90" r="11" fill="#1B2236"/>
      <circle cx="128" cy="90" r="11" fill="#1B2236"/>
      <path fill="#1B2236" d="M 100 104 L 108 112 L 100 126 L 92 112 Z"/>
    </g>
  </g>
</svg>
