<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Parliament of Owls">
  <!--
    Parliament of Owls — square mark
    A gold "parliamentary seal" coin carrying an ink owl.
    Palette: amber #E9A83E / deep amber #B97A24 / ink #263250 / cream #F5EBD8
    The coin guarantees legibility on both light (#ffffff) and dark (#0d1117)
    backgrounds; the dotted seal ring and chest chevrons fade out gracefully
    at favicon sizes.
  -->

  <!-- Coin -->
  <circle cx="100" cy="100" r="94" fill="#E9A83E"/>

  <!-- Dotted seal ring (stamp perforations) -->
  <circle cx="100" cy="100" r="84" fill="none" stroke="#B97A24" stroke-width="3.5"
          stroke-linecap="round" stroke-dasharray="0.1 12.05"/>

  <!-- Owl bust: ear tufts, brow dip, full chest -->
  <path fill="#263250" d="M 100 66
    Q 77 64 50 30
    Q 34 58 38 92
    C 39 132 60 168 100 170
    C 140 168 161 132 162 92
    Q 166 58 150 30
    Q 123 64 100 66 Z"/>

  <!-- Facial discs: kept apart (12-unit ink gap) so the eyes stay two
       separate masses when rasterised at 16px -->
  <circle cx="68"  cy="88" r="26" fill="#F5EBD8"/>
  <circle cx="132" cy="88" r="26" fill="#F5EBD8"/>

  <!-- Pupils: large and solid — no catchlights, which washed the pupils
       grey at favicon sizes -->
  <circle cx="68"  cy="88" r="14" fill="#263250"/>
  <circle cx="132" cy="88" r="14" fill="#263250"/>

  <!-- Beak: dropped below the discs so the inter-eye column stays ink -->
  <path fill="#E9A83E" d="M 100 110 L 108 118 L 100 132 L 92 118 Z"/>

  <!-- Chest feather chevrons (large-size detail only) -->
  <path d="M 84 142 Q 100 150 116 142" stroke="#3A4869" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 89 154 Q 100 160 111 154" stroke="#3A4869" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
